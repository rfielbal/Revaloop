[package]
name = "revaloop-desktop"
version = "0.1.0-alpha.1"
description = "Le compagnon desktop local et sécurisé de Revaloop."
authors = ["Revaloop contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "revaloop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
